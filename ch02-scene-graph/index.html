<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2장 · 스크롤 연동 3D 히어로 섹션</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0d12; color: #e8ecf4; }
    /* 캔버스는 화면에 고정하고, 콘텐츠가 그 위로 스크롤됩니다. */
    #app { position: fixed; inset: 0; display: block; z-index: 0; }
    main { position: relative; z-index: 1; pointer-events: none; }
    section {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; padding: 0 8vw; max-width: 520px;
    }
    section:nth-of-type(2) { margin-left: auto; text-align: right; }
    h1 { font-size: clamp(2.2rem, 5vw, 4rem); margin: 0 0 0.4em; line-height: 1.15; }
    p { font-size: 1.05rem; line-height: 1.7; color: #aab3c5; margin: 0; }
    .scroll-hint { position: fixed; bottom: 24px; left: 50%; translate: -50% 0; color: #67718a; font-size: 0.85rem; z-index: 1; }
    #back-to-list {
      position: fixed; top: 14px; left: 50%; translate: -50% 0; z-index: 20;
      background: rgba(13, 16, 24, 0.78); color: #cfd6e4;
      border: 1px solid #35405a; border-radius: 999px;
      padding: 7px 16px; font-size: 13px; text-decoration: none;
    }
    #back-to-list:hover { background: #273042; color: #fff; }
  </style>
</head>
<body>
  <a id="back-to-list" href="../index.html">← 목록으로</a>
  <canvas id="app"></canvas>
  <main>
    <section>
      <h1>공간을<br />스크롤하다</h1>
      <p>스크롤은 페이지 이동이 아니라 카메라의 여정입니다. 장면 그래프로 만든 카메라 리그가 스크롤 진행도를 따라 3D 공간을 통과합니다.</p>
    </section>
    <section>
      <h1>계층이 만드는<br />움직임</h1>
      <p>부모 그룹은 궤도를 돌고, 자식은 스스로 회전합니다. 복잡해 보이는 연출도 결국 변환의 상속입니다.</p>
    </section>
    <section>
      <h1>시선을<br />설계하라</h1>
      <p>마우스 패럴랙스는 리그의 바깥 그룹에, 스크롤 이동은 안쪽 그룹에. 역할을 나누면 연출은 단순해집니다.</p>
    </section>
  </main>
  <div class="scroll-hint">스크롤 ↓</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
