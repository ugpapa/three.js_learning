<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10장 · Blender × Claude — 내 방을 웹에 올리기</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #app { display: block; }
    #panel {
      position: fixed; left: 16px; top: 16px; max-width: 340px;
      background: rgba(13, 16, 24, 0.8); backdrop-filter: blur(10px);
      border: 1px solid #2a3348; border-radius: 12px; padding: 14px 16px;
      color: #cfd6e4; font-size: 13.5px; line-height: 1.65;
    }
    #panel b { color: #fff; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #0d1017; color: #cfd6e4; font-size: 15px;
      transition: opacity 0.6s; z-index: 10;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #home {
      position: fixed; right: 16px; bottom: 16px;
      background: #1d2330; color: #dfe6f3; border: 1px solid #35405a;
      padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    #home:hover { background: #273042; }
    #tooltip {
      position: fixed; z-index: 5; pointer-events: none;
      background: rgba(13, 16, 24, 0.92); color: #e8ecf4;
      border: 1px solid #35405a; border-radius: 8px;
      padding: 8px 12px; font-size: 12.5px; line-height: 1.55; max-width: 240px;
      opacity: 0; transition: opacity 0.15s;
    }
    #tooltip.show { opacity: 1; }
    #tooltip b { color: #9cc4ff; }
    #back-to-list {
      position: fixed; top: 14px; left: 50%; translate: -50% 0; z-index: 20;
      background: rgba(13, 16, 24, 0.78); color: #cfd6e4;
      border: 1px solid #35405a; border-radius: 999px;
      padding: 7px 16px; font-size: 13px; text-decoration: none;
    }
    #back-to-list:hover { background: #273042; color: #fff; }
  </style>
</head>
<body>
  <a id="back-to-list" href="../index.html">← 목록으로</a>
  <canvas id="app"></canvas>
  <div id="loading">모델 로딩 중…</div>
  <div id="panel">
    <b>Blender × Claude 룸 뷰어</b><br />
    이 방은 Claude가 blender-mcp로 Blender를 조종해 모델링하고
    glTF로 내보낸 결과물입니다. 10장의 안내대로 여러분의 방을 만들어
    <b>public/models/room.glb</b> 파일을 교체하면 그 방이 이 자리에 나타납니다.<br /><br />
    책상·책장·침대 탁자·의자·PC·창문에 마우스를 올리면 설명이 뜨고,
    클릭하면 카메라가 다가갑니다. ‘원래 위치로’ 버튼으로 복귀하십시오.
    우측 상단 슬라이더로 조명도 직접 조절해 보십시오.
  </div>
  <button id="home">⌂ 원래 위치로</button>
  <div id="tooltip"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
